[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanic-clean-architecture"
version = "0.1.0"
description = "A Sanic application demonstrating Clean Architecture and dependency injection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.0",
    "pydantic>=2.0",
    "sanic>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sanic-clean-architecture = "server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["app", "server"]
